<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 175" width="100%" height="auto">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11091F" />
      <stop offset="100%" stop-color="#07040D" />
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#351C54" />
      <stop offset="100%" stop-color="#FF2A5F" stop-opacity="0.3" />
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .proj-title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 700;
      fill: #FFFFFF;
    }
    .proj-desc {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      font-size: 12px;
      line-height: 1.45;
      fill: #94A3B8;
    }
    .proj-tag {
      font-family: 'SF Mono', 'Fira Code', Consolas, monospace;
      font-size: 10.5px;
      font-weight: 500;
      fill: #CBD5E1;
    }
  </style>

  <!-- Card Body -->
  <rect x="2" y="2" width="296" height="171" rx="14" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" />

  <!-- Top Header Row -->
  <g transform="translate(18, 20)">
    <!-- Glowing Planet/AI Orb Container -->
    <rect x="0" y="0" width="34" height="34" rx="8" fill="#1A0D2E" stroke="#A855F7" stroke-width="0.8" stroke-opacity="0.5" />
    <!-- Planet with Orbit Ring Vector Icon -->
    <g transform="translate(6, 6)" filter="url(#purpleGlow)">
      <circle cx="11" cy="11" r="7" fill="#8B5CF6" />
      <ellipse cx="11" cy="11" rx="11" ry="3.5" fill="none" stroke="#FF2A5F" stroke-width="1.3" transform="rotate(-25 11 11)" />
      <circle cx="15" cy="8" r="1.5" fill="#FFFFFF" />
    </g>

    <!-- Title -->
    <text x="44" y="22" class="proj-title">SkillGap-AI</text>

    <!-- External Link Arrow Icon -->
    <g transform="translate(242, 6)" stroke="#71717A" stroke-width="1.4" fill="none">
      <path d="M 0 12 L 12 0" />
      <polyline points="4,0 12,0 12,8" />
    </g>
  </g>

  <!-- Description -->
  <g transform="translate(18, 74)">
    <text class="proj-desc">
      <tspan x="0" y="0">AI-powered resume analyzer with skill</tspan>
      <tspan x="0" y="18">gap detection &amp; tailored learning path.</tspan>
    </text>
  </g>

  <!-- Tag Pills -->
  <g transform="translate(18, 128)">
    <!-- Tag 1: Gemini API -->
    <rect x="0" y="0" width="88" height="24" rx="6" fill="#160C28" stroke="#331A52" stroke-width="1" />
    <text x="9" y="16" class="proj-tag">Gemini API</text>

    <!-- Tag 2: Flask -->
    <rect x="96" y="0" width="52" height="24" rx="6" fill="#160C28" stroke="#331A52" stroke-width="1" />
    <text x="11" y="16" class="proj-tag">Flask</text>

    <!-- Tag 3: PDF -->
    <rect x="156" y="0" width="46" height="24" rx="6" fill="#160C28" stroke="#331A52" stroke-width="1" />
    <text x="11" y="16" class="proj-tag">PDF</text>
  </g>
</svg>
