<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 175" width="100%" height="auto">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11091F" />
      <stop offset="100%" stop-color="#07040D" />
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A5F" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#351C54" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.4" />
    </linearGradient>
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .proj-title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      font-size: 15.5px;
      font-weight: 700;
      fill: #FFFFFF;
    }
    .proj-desc {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      font-size: 12px;
      line-height: 1.45;
      fill: #94A3B8;
    }
    .proj-tag {
      font-family: 'SF Mono', 'Fira Code', Consolas, monospace;
      font-size: 10.5px;
      font-weight: 500;
      fill: #CBD5E1;
    }
  </style>

  <!-- Card Body -->
  <rect x="2" y="2" width="296" height="171" rx="14" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" />

  <!-- Top Header Row -->
  <g transform="translate(18, 20)">
    <!-- Glowing Saturn/Astronomy Container -->
    <rect x="0" y="0" width="34" height="34" rx="8" fill="#1C0D26" stroke="#FF2A5F" stroke-width="0.8" stroke-opacity="0.5" />
    <!-- Saturn Ring Vector Icon -->
    <g transform="translate(6, 6)" filter="url(#crimsonGlow)">
      <circle cx="11" cy="11" r="6" fill="#FF2A5F" />
      <ellipse cx="11" cy="11" rx="12" ry="4" fill="none" stroke="#A855F7" stroke-width="1.4" transform="rotate(-30 11 11)" />
      <path d="M 7 9 A 6 6 0 0 1 15 7" stroke="#FFE4E6" stroke-width="1" fill="none" />
    </g>

    <!-- Title -->
    <text x="44" y="22" class="proj-title">Exoplanet Detection</text>

    <!-- External Link Arrow Icon -->
    <g transform="translate(242, 6)" stroke="#71717A" stroke-width="1.4" fill="none">
      <path d="M 0 12 L 12 0" />
      <polyline points="4,0 12,0 12,8" />
    </g>
  </g>

  <!-- Description -->
  <g transform="translate(18, 74)">
    <text class="proj-desc">
      <tspan x="0" y="0">AI-based detection of exoplanets from</tspan>
      <tspan x="0" y="18">noisy astronomical light curves.</tspan>
    </text>
  </g>

  <!-- Tag Pills -->
  <g transform="translate(18, 128)">
    <!-- Tag 1: ML -->
    <rect x="0" y="0" width="40" height="24" rx="6" fill="#160C28" stroke="#331A52" stroke-width="1" />
    <text x="11" y="16" class="proj-tag">ML</text>

    <!-- Tag 2: Time Series -->
    <rect x="48" y="0" width="94" height="24" rx="6" fill="#160C28" stroke="#331A52" stroke-width="1" />
    <text x="10" y="16" class="proj-tag">Time Series</text>

    <!-- Tag 3: Astronomy -->
    <rect x="150" y="0" width="86" height="24" rx="6" fill="#160C28" stroke="#331A52" stroke-width="1" />
    <text x="10" y="16" class="proj-tag">Astronomy</text>
  </g>
</svg>
