      <path d="M 13.5 1 C 12.5 5 10 7.5 7 10.5 C 3 14.5 1.5 18 2.5 22.5 C 3.8 27.5 8.5 30.5 13.5 30.5 C 18.5 30.5 23 27.5 24.5 22.5 C 25.5 19 24.5 15 22 12 L 20 14 C 21.5 16.5 22 19 21.5 21.5 C 20.5 25 17 27 13.5 27 C 10 27 6.5 25 5.5 21.5 C 4.8 18.5 6 15.5 9 13 C 11.5 10.5 13.5 7.5 14 4 Z" fill="#EE4C2C" />
      <circle cx="19" cy="5" r="2.5" fill="#EE4C2C" />
    </g>
  </g>

  <!-- 5. TENSORFLOW (Center: 417, 38) -->
  <g transform="translate(417, 38)">
    <circle cx="0" cy="0" r="23" fill="url(#slotHover)" stroke="#381E57" stroke-width="1" />
    <g transform="translate(-13, -14) scale(0.85)">
      <!-- TF Isometric Logo -->
      <polygon points="14,1 26,8 26,17 20,13.5 20,9.5 14,6 14,29 8,25.5 8,8" fill="#FF6F00" />
      <polygon points="14,1 20,4.5 20,13.5 14,10" fill="#FF9100" />
      <polygon points="20,13.5 26,17 26,26 20,22.5" fill="#FF6F00" />
    </g>
  </g>

  <!-- 6. AZURE (Center: 505, 38) -->
  <g transform="translate(505, 38)">
    <circle cx="0" cy="0" r="23" fill="url(#slotHover)" stroke="#381E57" stroke-width="1" />
    <g transform="translate(-13, -13) scale(0.85)">
      <!-- Microsoft Azure Origami -->
      <path d="M 18.5 0 L 8.5 8.5 L 0 21.5 L 6.5 25.5 L 18 10 Z" fill="#0078D4" />
      <path d="M 18.5 0 L 11 15 L 16 23 L 26 23 Z" fill="#5EA0EF" />
      <path d="M 8.5 8.5 L 18.5 0 L 14 12 Z" fill="#005BA1" />
    </g>
  </g>

  <!-- 7. DOCKER (Center: 593, 38) -->
  <g transform="translate(593, 38)">
    <circle cx="0" cy="0" r="23" fill="url(#slotHover)" stroke="#381E57" stroke-width="1" />
    <g transform="translate(-15, -11) scale(0.85)">
      <!-- Docker Whale & Containers -->
      <path d="M 28 8.5 C 27 8.5 26 9 25.5 9.8 C 24 9 22 8.8 20 9.2 L 20 7 H 17 V 9.5 H 15 V 7 H 12 V 9.5 H 10 V 7 H 7 V 9.5 H 5 V 7 H 2 V 12 H 20 C 23 12 25.5 14 26 16.5 C 28 16.5 30 15 30.5 13 C 31 11 30 9 28 8.5 Z" fill="#2496ED" />
      <path d="M 0 13 C 1 17 4 20 9 20 C 16 20 23 18 25 13 H 0 Z" fill="#2496ED" />
    </g>
  </g>

  <!-- 8. POSTGRESQL (Center: 681, 38) -->
  <g transform="translate(681, 38)">
    <circle cx="0" cy="0" r="23" fill="url(#slotHover)" stroke="#381E57" stroke-width="1" />
    <g transform="translate(-13, -14) scale(0.85)">
