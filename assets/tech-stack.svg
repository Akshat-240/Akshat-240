      <path d="M 14 1 C 8 1 3 5 3 11 C 3 15 5 18 8 20 L 7 27 L 11 25 C 12 26 13 26 14 26 C 20 26 25 21 25 15 C 25 7 20 1 14 1 Z M 13 8 C 14.5 8 15.5 9 15.5 10.5 C 15.5 12 14.5 13 13 13 C 11.5 13 10.5 12 10.5 10.5 C 10.5 9 11.5 8 13 8 Z" fill="#336791" />
    </g>
  </g>

