      <path d="M 27.5 12.5 L 17.5 2.5 C 16.5 1.5 15 1.5 14 2.5 L 12 4.5 L 15.5 8 C 16.5 7.5 18 8 18.5 9 C 19.5 10 19 11.5 18.5 12.5 L 22 16 C 23 15.5 24.5 16 25 17 C 26 18.5 25.5 20.5 24 21.5 C 22.5 22.5 20.5 22 19.5 20.5 C 19 19.5 19 18.5 19.5 17.5 L 16 14 C 15.5 14.5 14.5 14.5 13.5 14 L 10 17.5 L 10 22 C 10.5 22.5 11 23 11 24 C 11 25.5 9.5 27 8 27 C 6.5 27 5 25.5 5 24 C 5 22.5 6 21.5 7.5 21 L 7.5 16.5 C 6 16 5 15 5 13.5 C 5 12 6.5 10.5 8 10.5 C 9 10.5 10 11 10.5 12 L 14 8.5 L 2.5 20 C 1.5 21 1.5 22.5 2.5 23.5 L 12.5 33.5 C 13.5 34.5 15 34.5 16 33.5 L 27.5 22 C 28.5 21 28.5 19.5 27.5 18.5 Z" fill="#F05032" />
    </g>
  </g>

  <!-- 10. GITHUB (Center: 855, 38) -->
  <g transform="translate(855, 38)">
    <circle cx="0" cy="0" r="23" fill="url(#slotHover)" stroke="#381E57" stroke-width="1" />
    <g transform="translate(-13, -13) scale(0.85)">
      <!-- GitHub Octocat Invert -->
      <path fill-rule="evenodd" clip-rule="evenodd" d="M15 0C6.7 0 0 6.7 0 15c0 6.6 4.3 12.2 10.3 14.2.8.1 1-.3 1-.7v-2.7c-4.2.9-5.1-2-5.1-2-.7-1.7-1.7-2.2-1.7-2.2-1.4-.9.1-.9.1-.9 1.5.1 2.3 1.5 2.3 1.5 1.3 2.3 3.5 1.6 4.4 1.2.1-1 .5-1.6 1-2-3.3-.4-6.8-1.7-6.8-7.5 0-1.7.6-3 1.6-4.1-.2-.4-.7-1.9.2-4 0 0 1.3-.4 4.2 1.6 1.2-.3 2.5-.5 3.8-.5 1.3 0 2.6.2 3.8.5 2.9-2 4.2-1.6 4.2-1.6.9 2.1.4 3.6.2 4 1 1.1 1.6 2.4 1.6 4.1 0 5.8-3.5 7.1-6.8 7.5.5.5 1 1.4 1 2.8v4.1c0 .4.3.9 1.1.7C25.7 27.2 30 21.6 30 15c0-8.3-6.7-15-15-15z" fill="#FFFFFF" />
    </g>
