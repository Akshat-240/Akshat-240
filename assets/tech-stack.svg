<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 76" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="dockBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E081C" />
      <stop offset="50%" stop-color="#07050E" />
      <stop offset="100%" stop-color="#0E081C" />
    </linearGradient>
    <linearGradient id="dockBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#FF2A5F" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.5" />
    </linearGradient>

    <!-- Icon Slot Gradients -->
    <radialGradient id="slotHover" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#231338" />
      <stop offset="100%" stop-color="#120A1E" />
    </radialGradient>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dock Outer Container -->
  <rect x="2" y="2" width="916" height="72" rx="36" fill="url(#dockBg)" stroke="url(#dockBorder)" stroke-width="1.2" />

  <!-- 10 Tech Icon Slots -->

  <!-- 1. PYTHON (Center: 65, 38) -->
  <g transform="translate(65, 38)">
    <circle cx="0" cy="0" r="23" fill="url(#slotHover)" stroke="#381E57" stroke-width="1" />
    <g transform="translate(-13, -13) scale(0.81)">
      <!-- Python Official Vector -->
      <path d="M 15.8 0 C 7.3 0 7.8 3.7 7.8 3.7 L 7.8 7.5 L 16 7.5 L 16 8.7 L 4.9 8.7 C 4.9 8.7 0 8.1 0 16.7 C 0 25.2 4.3 24.8 4.3 24.8 L 6.8 24.8 L 6.8 21.3 C 6.8 21.3 6.7 17.1 11 17.1 L 19.3 17.1 C 19.3 17.1 23.3 17.2 23.3 13.3 L 23.3 4.2 C 23.3 4.2 23.9 0 15.8 0 Z M 11.4 2.5 C 12.2 2.5 12.8 3.1 12.8 3.9 C 12.8 4.7 12.2 5.3 11.4 5.3 C 10.6 5.3 10 4.7 10 3.9 C 10 3.1 10.6 2.5 11.4 2.5 Z" fill="#387EB8" />
      <path d="M 16.2 32 C 24.7 32 24.2 28.3 24.2 28.3 L 24.2 24.5 L 16 24.5 L 16 23.3 L 27.1 23.3 C 27.1 23.3 32 23.9 32 15.3 C 32 6.8 27.7 7.2 27.7 7.2 L 25.2 7.2 L 25.2 10.7 C 25.2 10.7 25.3 14.9 21 14.9 L 12.7 14.9 C 12.7 14.9 8.7 14.8 8.7 18.7 L 8.7 27.8 C 8.7 27.8 8.1 32 16.2 32 Z M 20.6 29.5 C 19.8 29.5 19.2 28.9 19.2 28.1 C 19.2 27.3 19.8 26.7 20.6 26.7 C 21.4 26.7 22 27.3 22 28.1 C 22 28.9 21.4 29.5 20.6 29.5 Z" fill="#FFE873" />
    </g>
  </g>

  <!-- 2. C++ (Center: 153, 38) -->
  <g transform="translate(153, 38)">
    <circle cx="0" cy="0" r="23" fill="url(#slotHover)" stroke="#381E57" stroke-width="1" />
    <g transform="translate(-14, -14) scale(0.9)">
      <polygon points="15,0 28,7.5 28,22.5 15,30 2,22.5 2,7.5" fill="#00599C" />
      <polygon points="15,3 25,8.8 25,21.2 15,27 5,21.2 5,8.8" fill="#004482" />
      <!-- C++ text -->
      <text x="7" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF">C++</text>
    </g>
  </g>

  <!-- 3. JUPYTER (Center: 241, 38) -->
  <g transform="translate(241, 38)">
    <circle cx="0" cy="0" r="23" fill="url(#slotHover)" stroke="#381E57" stroke-width="1" />
    <g transform="translate(-13, -14) scale(0.85)">
