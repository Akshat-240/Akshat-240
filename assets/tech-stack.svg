      <path d="M 15 5 C 9 5 4 8 3 13 C 5 12 9 11 15 11 C 21 11 25 12 27 13 C 26 8 21 5 15 5 Z" fill="#F37626" />
      <circle cx="25" cy="5" r="2.5" fill="#9E9E9E" />
      <circle cx="4" cy="25" r="2.5" fill="#F37626" />
      <circle cx="26" cy="23" r="1.8" fill="#616161" />
      <path d="M 15 25 C 21 25 26 22 27 17 C 25 18 21 19 15 19 C 9 19 5 18 3 17 C 4 22 9 25 15 25 Z" fill="#F37626" />
    </g>
  </g>

