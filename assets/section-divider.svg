<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="divGradLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2A5F" stop-opacity="0" />
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF2A5F" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="divGradRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2A5F" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#8B5CF6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF2A5F" stop-opacity="0" />
    </linearGradient>
    <filter id="divGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(0, 12)">
    <!-- Left Trace -->
    <line x1="50" y1="0" x2="425" y2="0" stroke="url(#divGradLeft)" stroke-width="1.5" />
    <!-- Right Trace -->
    <line x1="475" y1="0" x2="850" y2="0" stroke="url(#divGradRight)" stroke-width="1.5" />

    <!-- Center Diamond & Core -->
    <g transform="translate(450, 0)">
      <!-- Outer diamond halo -->
      <polygon points="0,-7 7,0 0,7 -7,0" fill="#180A26" stroke="#8B5CF6" stroke-width="1" />
      <!-- Inner glowing core -->
      <polygon points="0,-4 4,0 0,4 -4,0" fill="#FF2A5F" filter="url(#divGlow)" />
      <!-- Lateral Accents -->
      <circle cx="-16" cy="0" r="1.5" fill="#A855F7" />
      <circle cx="16" cy="0" r="1.5" fill="#A855F7" />
      <circle cx="-30" cy="0" r="1" fill="#FF2A5F" opacity="0.6" />
      <circle cx="30" cy="0" r="1" fill="#FF2A5F" opacity="0.6" />
    </g>
  </g>
</svg>
