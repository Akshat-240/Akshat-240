<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050609" />
      <stop offset="45%" stop-color="#080712" />
      <stop offset="80%" stop-color="#120617" />
      <stop offset="100%" stop-color="#050609" />
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B1D54" />
      <stop offset="35%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#FF2A5F" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2D123D" />
    </linearGradient>

    <!-- Crimson Eclipse Moon Gradients -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2A5F" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#A855F7" stop-opacity="0.25" />
      <stop offset="75%" stop-color="#FF1744" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="moonSurface" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF1F2" />
      <stop offset="20%" stop-color="#FFA4B8" />
      <stop offset="55%" stop-color="#FF2A5F" />
      <stop offset="85%" stop-color="#9F1239" />
      <stop offset="100%" stop-color="#4C0519" />
    </radialGradient>

    <!-- Quote Box Gradient -->
    <linearGradient id="quoteBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#160B24" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0C0A17" stop-opacity="0.6" />
    </linearGradient>

    <!-- Neural Grid Pattern -->
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#8B5CF6" stroke-width="0.5" stroke-opacity="0.07" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseAura {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }
    .cursor-blink {
      animation: cursorBlink 1.1s infinite;
    }
    .title-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .mono-text {
      font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace;
    }
    .body-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif;
    }
  </style>

  <!-- Main Background Container -->
  <rect x="8" y="8" width="1184" height="364" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Subtle Tech Grid Overlay -->
  <rect x="8" y="8" width="1184" height="364" rx="20" fill="url(#techGrid)" />

  <!-- Outer HUD Precision Corner Accents -->
  <g stroke="#A855F7" stroke-width="1.5" stroke-opacity="0.7" fill="none">
    <path d="M 24 35 L 24 24 L 35 24" />
    <path d="M 1176 35 L 1176 24 L 1165 24" />
    <path d="M 24 345 L 24 356 L 35 356" />
    <path d="M 1176 345 L 1176 356 L 1165 356" />
  </g>

  <!-- Top Navigation / Metadata Line -->
  <g transform="translate(48, 42)">
    <!-- Terminal / File Icon -->
    <path d="M 0 4 L 4 0 L 12 0 L 16 4 L 16 16 L 0 16 Z" fill="none" stroke="#71717A" stroke-width="1.2" />
    <line x1="4" y1="8" x2="12" y2="8" stroke="#71717A" stroke-width="1.2" />
    <line x1="4" y1="12" x2="9" y2="12" stroke="#71717A" stroke-width="1.2" />
    <text x="24" y="13" class="mono-text" font-size="13" fill="#71717A" letter-spacing="0.5">Akshat-240 / README.md</text>
  </g>

  <!-- Top-Right Status Badge (AI/ML) -->
  <g transform="translate(1055, 30)">
    <rect x="0" y="0" width="95" height="28" rx="14" fill="#1C102E" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="16" cy="14" r="3.5" fill="#FF2A5F" filter="url(#subtleGlow)" />
    <text x="28" y="18" class="mono-text" font-size="12" font-weight="600" fill="#E2E8F0" letter-spacing="0.5">AI / ML</text>
  </g>

  <!-- ================= RIGHT SIDE: CINEMATIC CRIMSON ECLIPSE ARTWORK ================= -->

  <!-- Atmospheric Glow behind mountains and moon -->
  <circle cx="925" cy="170" r="145" fill="url(#moonGlow)" filter="url(#crimsonGlow)" />
  <circle cx="925" cy="170" r="95" fill="url(#moonGlow)" />

  <!-- Crimson Moon Body -->
  <g transform="translate(925, 170)">
    <!-- Outer rim atmospheric ring -->
    <circle cx="0" cy="0" r="62" fill="none" stroke="#FF2A5F" stroke-width="1.2" stroke-opacity="0.4" />
    <!-- Moon Sphere -->
    <circle cx="0" cy="0" r="58" fill="url(#moonSurface)" filter="url(#subtleGlow)" />
    <!-- Craters / Maria Shadow details -->
    <path d="M -25 -15 Q -10 -22 5 -12 Q 22 -3 15 18 Q 8 32 -12 25 Q -32 18 -25 -15 Z" fill="#70092B" opacity="0.42" />
    <circle cx="-18" cy="-22" r="7" fill="#580822" opacity="0.35" />
    <circle cx="22" cy="8" r="9" fill="#580822" opacity="0.38" />
    <circle cx="8" cy="-30" r="5" fill="#580822" opacity="0.3" />
    <circle cx="-2" cy="28" r="11" fill="#580822" opacity="0.4" />
    <circle cx="-32" cy="5" r="6" fill="#580822" opacity="0.32" />
    <!-- Subtle eclipse shadow edge -->
    <path d="M 0 -58 A 58 58 0 0 1 45 42 A 58 58 0 0 0 0 -58 Z" fill="#1A040E" opacity="0.35" />
  </g>

  <!-- Distant Mountain Ridge (Deep Maroon/Violet) -->
  <path d="M 640 340 L 720 250 L 780 280 L 850 215 L 940 265 L 1020 195 L 1110 270 L 1184 240 L 1184 365 L 640 365 Z"
        fill="#140A20" stroke="#FF2A5F" stroke-width="0.8" stroke-opacity="0.35" />

  <!-- Midground Mountain Peaks with Crimson Light Highlights -->
  <path d="M 690 350 L 790 260 L 860 300 L 935 235 L 1005 285 L 1090 220 L 1184 275 L 1184 365 L 690 365 Z"
        fill="#0D0717" stroke="#A855F7" stroke-width="0.8" stroke-opacity="0.4" />

  <!-- Subtle Misty Cloud Waves across the Peaks -->
  <path d="M 650 315 Q 750 285 880 310 T 1120 295 T 1184 315 L 1184 365 L 650 365 Z"
        fill="#1B0A26" opacity="0.45" />

  <!-- Foreground Cliff Ledge (Right side where silhouette stands/sits) -->
  <path d="M 880 365 L 890 315 L 940 305 L 970 275 L 1060 270 L 1100 290 L 1184 285 L 1184 365 Z"
        fill="#07040D" stroke="#3B1D54" stroke-width="1.2" />

  <!-- Anime Silhouette: Contemplative Cloaked Figure sitting/looking toward the crimson moon -->
  <g transform="translate(995, 205)">
    <!-- Cloak / Body Silhouette -->
    <path d="M 22 65 C 18 52 14 38 18 28 C 20 22 24 16 30 12 C 34 8 36 3 34 -2 C 32 -7 27 -10 24 -11 C 21 -12 18 -10 16 -7 C 14 -3 14 2 13 6 C 10 9 7 13 6 18 C 3 24 1 32 0 42 C -2 52 -5 62 -7 68 C 1 67 15 66 22 65 Z"
          fill="#050309" />
    <!-- Character Head and Anime Hair spikes facing left toward moon -->
    <path d="M 23 -11 C 22 -16 18 -21 13 -23 C 11 -21 11 -17 12 -15 C 9 -17 6 -17 5 -14 C 4 -12 5 -9 7 -7 C 3 -8 0 -6 1 -3 C 2 0 5 1 8 2 C 7 5 7 8 10 9 C 14 10 19 8 22 5 C 24 1 25 -6 23 -11 Z"
          fill="#050309" />
    <!-- Flowing Cloak Tail & Collar (High Akatsuki collar silhouette) -->
    <path d="M 17 6 C 14 -2 9 -6 6 -8 C 5 -4 6 2 8 8 Z" fill="#0A0612" />
    <path d="M 30 14 C 38 20 46 32 52 46 C 45 48 36 52 30 58 C 33 46 32 32 28 20 Z" fill="#06030A" />
    <!-- Iconic Red Accent on cloak (Subtle crimson cloud highlight) -->
    <path d="M 12 36 C 10 33 13 30 16 31 C 18 29 22 30 22 33 C 24 34 24 38 21 39 C 22 41 20 44 17 43 C 14 44 11 42 12 39 C 10 38 10 37 12 36 Z"
          fill="#FF2A5F" opacity="0.85" filter="url(#subtleGlow)" />
  </g>

  <!-- Neural Frequency Audio Spectrum / Circuit Wave at Base of Artwork -->
  <g transform="translate(620, 325)">
    <!-- Circuit lines with nodes -->
    <path d="M 0 10 H 70 L 95 28 H 190 L 210 10 H 310 L 330 24 H 430 L 450 10 H 540"
          fill="none" stroke="#8B5CF6" stroke-width="1.2" stroke-opacity="0.45" />
    <circle cx="70" cy="10" r="3" fill="#FF2A5F" filter="url(#subtleGlow)" />
    <circle cx="95" cy="28" r="2.5" fill="#8B5CF6" />
    <circle cx="210" cy="10" r="3" fill="#A855F7" />
    <circle cx="330" cy="24" r="2.5" fill="#FF2A5F" />
    <circle cx="450" cy="10" r="3" fill="#8B5CF6" />

    <!-- Subtle audio equalizer bars below -->
    <g fill="#A855F7" opacity="0.35">
      <rect x="20" y="5" width="2" height="10" rx="1" />
      <rect x="28" y="1" width="2" height="14" rx="1" />
      <rect x="36" y="-3" width="2" height="18" rx="1" fill="#FF2A5F" opacity="0.7" />
      <rect x="44" y="3" width="2" height="12" rx="1" />
      <rect x="52" y="7" width="2" height="8" rx="1" />
      <rect x="130" y="6" width="2" height="16" rx="1" />
      <rect x="138" y="0" width="2" height="22" rx="1" fill="#FF2A5F" opacity="0.7" />
      <rect x="146" y="8" width="2" height="14" rx="1" />
      <rect x="250" y="3" width="2" height="12" rx="1" />
      <rect x="258" y="-4" width="2" height="22" rx="1" fill="#FF2A5F" opacity="0.7" />
      <rect x="266" y="2" width="2" height="15" rx="1" />
      <rect x="370" y="4" width="2" height="14" rx="1" />
      <rect x="378" y="-2" width="2" height="20" rx="1" fill="#FF2A5F" opacity="0.7" />
      <rect x="386" y="6" width="2" height="12" rx="1" />
    </g>
  </g>

  <!-- ================= LEFT SIDE: HERO TYPOGRAPHY & IDENTITY ================= -->

  <!-- Main Greeting Title -->
  <g transform="translate(48, 125)">
    <text class="title-text" font-size="44" fill="#FFFFFF">
      Hi, I'm <tspan fill="#FF2A5F" filter="url(#subtleGlow)">Akshat Nigam</tspan>
      <tspan fill="#A855F7" class="cursor-blink">|</tspan>
    </text>
  </g>

  <!-- Academic & Focus Subtitle -->
  <g transform="translate(48, 168)">
    <text class="body-text" font-size="16" font-weight="500" fill="#94A3B8" letter-spacing="0.4">
      B.Tech CSE (AI &amp; ML)  <tspan fill="#7C3AED" font-weight="600">|</tspan>  <tspan fill="#CBD5E1">AI/ML</tspan> • <tspan fill="#CBD5E1">Cloud</tspan> • <tspan fill="#CBD5E1">Systems</tspan> • <tspan fill="#CBD5E1">Research</tspan>
    </text>
  </g>

  <!-- Quote Box Container -->
  <g transform="translate(48, 206)">
    <!-- Dark Card Box with subtle crimson accent border -->
    <rect x="0" y="0" width="550" height="64" rx="10" fill="url(#quoteBg)" stroke="#2E1744" stroke-width="1.2" />
    <!-- Left Crimson Accent Strip -->
    <path d="M 0 10 Q 0 0 10 0 L 10 64 Q 0 64 0 54 Z" fill="#FF2A5F" />
    <!-- Quote Prompt Icon -->
    <text x="24" y="38" class="mono-text" font-size="18" font-weight="700" fill="#FF2A5F">&gt;</text>
    <!-- Quote Statement -->
    <text x="44" y="38" class="body-text" font-size="14.5" font-weight="500" font-style="italic" fill="#E2E8F0" letter-spacing="0.2">
      "Building AI systems, learning deeply, and shipping real projects."
    </text>
  </g>

  <!-- Technical Spec Micro-Pills below quote -->
  <g transform="translate(48, 298)">
    <!-- Micro Pill 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="135" height="24" rx="6" fill="#110A1F" stroke="#2B1647" stroke-width="1" />
      <circle cx="10" cy="12" r="3" fill="#FF2A5F" />
      <text x="20" y="16" class="mono-text" font-size="11" fill="#94A3B8">Deep Learning</text>
    </g>
    <!-- Micro Pill 2 -->
    <g transform="translate(145, 0)">
      <rect x="0" y="0" width="135" height="24" rx="6" fill="#110A1F" stroke="#2B1647" stroke-width="1" />
      <circle cx="10" cy="12" r="3" fill="#8B5CF6" />
      <text x="20" y="16" class="mono-text" font-size="11" fill="#94A3B8">Cloud Native</text>
    </g>
    <!-- Micro Pill 3 -->
    <g transform="translate(290, 0)">
      <rect x="0" y="0" width="145" height="24" rx="6" fill="#110A1F" stroke="#2B1647" stroke-width="1" />
      <circle cx="10" cy="12" r="3" fill="#06B6D4" />
      <text x="20" y="16" class="mono-text" font-size="11" fill="#94A3B8">Systems Architecture</text>
    </g>
  </g>

</svg>
