<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 90" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120A20" />
      <stop offset="100%" stop-color="#08060F" />
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#2D1A47" />
      <stop offset="100%" stop-color="#FF2A5F" stop-opacity="0.3" />
    </linearGradient>

    <!-- Icon Glow Filter -->
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .card-title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 700;
      fill: #F8FAFC;
    }
    .card-sub {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      font-size: 11.5px;
      font-weight: 500;
      fill: #94A3B8;
      letter-spacing: 0.3px;
    }
  </style>

  <!-- CARD 1: AI/ML -->
  <g transform="translate(5, 5)">
    <rect x="0" y="0" width="215" height="80" rx="12" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" />
    <!-- Icon Container -->
    <rect x="14" y="20" width="40" height="40" rx="8" fill="#1C0E28" stroke="#FF2A5F" stroke-width="0.8" stroke-opacity="0.4" />
    <!-- Code Bracket Icon -->
    <g transform="translate(20, 26)" stroke="#FF2A5F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#iconGlow)">
      <path d="M 8 5 L 2 14 L 8 23" />
      <path d="M 20 5 L 26 14 L 20 23" />
      <line x1="17" y1="5" x2="11" y2="23" stroke="#A855F7" stroke-width="1.5" />
    </g>
    <!-- Text -->
    <text x="64" y="38" class="card-title">AI/ML</text>
    <text x="64" y="56" class="card-sub">Build • Train • Deploy</text>
  </g>

  <!-- CARD 2: Cloud & DevOps -->
  <g transform="translate(235, 5)">
    <rect x="0" y="0" width="215" height="80" rx="12" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" />
    <!-- Icon Container -->
    <rect x="14" y="20" width="40" height="40" rx="8" fill="#1C0E28" stroke="#FF2A5F" stroke-width="0.8" stroke-opacity="0.4" />
    <!-- Cloud Icon -->
    <g transform="translate(20, 27)" stroke="#FF2A5F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#iconGlow)">
      <path d="M 6 18 A 5 5 0 0 1 11 12 A 6 6 0 0 1 21 10 A 5 5 0 0 1 24 18 H 6 Z" />
      <line x1="10" y1="21" x2="10" y2="23" stroke="#8B5CF6" stroke-width="1.4" />
      <line x1="15" y1="21" x2="15" y2="23" stroke="#8B5CF6" stroke-width="1.4" />
      <line x1="20" y1="21" x2="20" y2="23" stroke="#8B5CF6" stroke-width="1.4" />
    </g>
    <!-- Text -->
    <text x="64" y="38" class="card-title">Cloud &amp; DevOps</text>
    <text x="64" y="56" class="card-sub">Azure • Docker • CI/CD</text>
  </g>

  <!-- CARD 3: Systems & CS -->
  <g transform="translate(465, 5)">
    <rect x="0" y="0" width="215" height="80" rx="12" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" />
    <!-- Icon Container -->
    <rect x="14" y="20" width="40" height="40" rx="8" fill="#1C0E28" stroke="#FF2A5F" stroke-width="0.8" stroke-opacity="0.4" />
    <!-- Layers / Stack Icon -->
    <g transform="translate(20, 27)" stroke="#FF2A5F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#iconGlow)">
      <polygon points="14,4 25,10 14,16 3,10" />
      <path d="M 3 15 L 14 21 L 25 15" stroke="#A855F7" />
      <path d="M 3 20 L 14 26 L 25 20" stroke="#FF2A5F" />
    </g>
    <!-- Text -->
    <text x="64" y="38" class="card-title">Systems &amp; CS</text>
    <text x="64" y="56" class="card-sub">OS • DBMS • CN • COA</text>
  </g>

  <!-- CARD 4: Research -->
  <g transform="translate(695, 5)">
    <rect x="0" y="0" width="215" height="80" rx="12" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" />
    <!-- Icon Container -->
    <rect x="14" y="20" width="40" height="40" rx="8" fill="#1C0E28" stroke="#FF2A5F" stroke-width="0.8" stroke-opacity="0.4" />
    <!-- Chart / Analytics Icon -->
    <g transform="translate(20, 28)" stroke="#FF2A5F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#iconGlow)">
      <line x1="4" y1="23" x2="24" y2="23" stroke="#8B5CF6" />
      <line x1="7" y1="20" x2="7" y2="15" stroke-width="2.5" />
      <line x1="13" y1="20" x2="13" y2="9" stroke-width="2.5" />
      <line x1="19" y1="20" x2="19" y2="4" stroke-width="2.5" />
      <!-- Line graph overlay -->
      <polyline points="7,13 13,8 19,3" stroke="#A855F7" stroke-width="1.4" />
    </g>
    <!-- Text -->
    <text x="64" y="38" class="card-title">Research</text>
    <text x="64" y="56" class="card-sub">ML • Data • Applied AI</text>
  </g>
</svg>
